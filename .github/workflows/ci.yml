---
name: CI
on: [workflow_dispatch, push, pull_request]  # yamllint disable-line rule:truthy
jobs:
  omnilint:
    uses: lpenz/omnilint/.github/workflows/omnilint.yml@v0.6.0
  rust-test:
    uses: lpenz/ghworkflow-rust/.github/workflows/rust-test.yml@v0.30.0
    with:
      coveralls: true
      deb: true
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/build-push-action@v7.3.0
        with:
          push: false
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2.15.0
        with:
          branch: false
  rust-deploy:
    needs: [omnilint, commit-check, rust-test, docker-build]
    uses: lpenz/ghworkflow-rust/.github/workflows/rust-deploy.yml@v0.30.0
    with:
      deb: true
      release_files: |
        github-workflows-update github-workflows-update.1
      publish_cratesio: true
      publish_github_release: true
      publish_packagecloud_repository_deb: |
        ["debian/debian/trixie",
         "debian/debian/forky",
         "ubuntu/ubuntu/noble"]
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
  dockerhub-deploy:
    needs: [omnilint, commit-check, rust-test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        uses: docker://lpenz/ghaction-version-gen:0.20.0
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          push: ${{ steps.version.outputs.version_docker_ci != 'null' }}
          tags: ${{ github.repository }}:${{ steps.version.outputs.version_docker_ci
            }}
